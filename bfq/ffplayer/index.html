<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>忘情ffplayer</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; }
        #a1 { width: 100%; height: 100%; }

        /* 放大控制栏：默认约 44px，调到 56px */
        .artplayer-app { --art-control-height: 56px; }
    </style>
</head>
<body>

<div id="a1"></div>

<script>
(function () {
    'use strict';

    // ================= CDN 地址（按顺序尝试，前一个失败自动切下一个） =================
    var ART_URLS = [
        'https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js',
        'https://unpkg.com/artplayer/dist/artplayer.js',
        'https://cdnjs.cloudflare.com/ajax/libs/artplayer/5.2.1/artplayer.min.js'
    ];
    var HLS_URLS = [
        'https://cdn.jsdelivr.net/npm/hls.js@latest',
        'https://unpkg.com/hls.js@latest',
        'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.15/hls.min.js'
    ];

    // 依次尝试加载，全部失败时 reject
    function loadOne(urls) {
        return new Promise(function (resolve, reject) {
            var i = 0;
            (function next() {
                if (i >= urls.length) {
                    reject(new Error('全部 CDN 加载失败: ' + urls.join(' , ')));
                    return;
                }
                var s = document.createElement('script');
                s.src = urls[i++];
                s.onload  = function () { resolve(s.src); };
                s.onerror = function () { s.remove(); next(); };
                document.head.appendChild(s);
            })();
        });
    }

    Promise.all([loadOne(ART_URLS), loadOne(HLS_URLS)])
        .then(function () { start(); })
        .catch(function (err) {
            console.error(err);
            document.getElementById('a1').innerHTML =
                '<p style="color:#fff;text-align:center;padding-top:20%;">播放器资源加载失败，请检查网络后刷新</p>';
        });

    // ================= 播放器初始化 =================
    function start() {
        var main = "";                                       // 默认视频地址，可留空
        var pic  = "/20221010/20_0d345d0f/1.jpg";

        var params   = new URLSearchParams(location.search);
        var videoUrl = params.get('url') || main;

        if (!videoUrl) {
            document.getElementById('a1').innerHTML =
                '<p style="color:#fff;text-align:center;padding-top:20%;">未指定视频地址，请在 URL 后添加 ?url=视频链接</p>';
            return;
        }

        new Artplayer({
            container: '#a1',
            url: videoUrl,
            poster: location.protocol + '//' + location.host + pic,
            autoplay: true,
            fullscreen: true,       // 保留全屏图标
            fullscreenWeb: false,   // 隐藏网页全屏图标
            setting: true,
            playbackRate: true,
            aspectRatio: true,
            lock: true,
            fastForward: true,
            pip: true,
            theme: '#ff0057',
            miniProgressBar: true,
            whitelist: ['*'],
            customType: {
                m3u8: function (video, url) {
                    if (Hls.isSupported()) {
                        var hls = new Hls();
                        hls.loadSource(url);
                        hls.attachMedia(video);
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = url;
                    }
                }
            }
        });
    }
})();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>多播放器演示 · Player Demo</title>
<style>
  :root{
    /* 除播放器外所有 UI 占用的高度（顶栏+控制条+间距），用于算出播放器可用高度 */
    --chrome: 192px;
    --bg:#0b1020;
    --card:rgba(255,255,255,.055);
    --border:rgba(255,255,255,.12);
    --text:#e8ecf5;
    --muted:#8e9ab8;
    --accent:#4f8cff;
    --accent2:#8b5cf6;
  }
  @media (max-width:760px){
    :root{ --chrome: 224px; }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }

  body{
    margin:0;
    height:100vh;
    height:100dvh;            /* 移动端键盘弹出时自动收缩 */
    overflow:hidden;
    display:flex;
    flex-direction:column;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--text);
    background:var(--bg);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  /* 背景光晕 */
  body::before,body::after{
    content:"";position:fixed;width:520px;height:520px;border-radius:50%;
    filter:blur(130px);opacity:.28;pointer-events:none;z-index:0;
  }
  body::before{ background:#4f8cff; top:-220px; left:-170px; }
  body::after{ background:#8b5cf6; bottom:-240px; right:-170px; }

  /* ---------- 顶栏 ---------- */
  .topbar{
    flex:0 0 auto;
    position:relative; z-index:10;
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    background:rgba(11,16,32,.72);
    border-bottom:1px solid var(--border);
  }
  .topbar .wrap{
    width:min(1100px,100% - 28px); margin-inline:auto;
    display:flex; align-items:center; gap:12px;
    height:64px;
  }
  .logo{ display:flex; align-items:center; gap:9px; font-size:16px; font-weight:700; letter-spacing:.3px; }
  .logo i{
    width:10px;height:10px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 14px var(--accent);
  }
  .top-actions{ margin-left:auto; display:flex; gap:8px; }
  .ghost-btn{
    padding:8px 14px; border-radius:10px; cursor:pointer;
    font-family:inherit; font-size:13px; color:var(--muted);
    background:rgba(255,255,255,.04); border:1px solid var(--border);
    transition:.2s;
  }
  .ghost-btn:hover{ color:var(--text); background:rgba(255,255,255,.09); }

  /* ---------- 主体 ---------- */
  main{
    position:relative; z-index:1;
    flex:1 1 auto;
    min-height:0;
    width:min(1100px,100% - 28px);
    margin-inline:auto;
    padding:16px 0 18px;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:auto;                       /* 极端比例下的兜底 */
    overscroll-behavior:contain;
  }

  /* ---------- 播放区：核心自适应 ---------- */
  .stage{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .player-frame{
    position:relative;
    /* 宽度取「容器宽」与「可用高度换算出的宽度」中的较小值 → 永远完整可见 */
    width:min(100%, calc((100vh  - var(--chrome)) * 16 / 9));
    width:min(100%, calc((100dvh - var(--chrome)) * 16 / 9));
    aspect-ratio:16 / 9;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.07);
  }
  .player-frame iframe{
    position:absolute; inset:0;
    width:100%; height:100%;
    border:0; display:block; background:#000;
  }
  .placeholder{
    position:absolute; inset:0;
    display:grid; place-content:center; justify-items:center; gap:8px;
    text-align:center; padding:16px;
    background:linear-gradient(160deg,#0e1428,#080c18);
    color:var(--muted); font-size:13px;
  }
  .placeholder .big{ font-size:34px; line-height:1; opacity:.8; }
  .placeholder b{ color:var(--text); font-weight:600; font-size:15px; }

  /* ---------- 控制条 ---------- */
  .controls{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:220px minmax(0,1fr) auto;
    gap:12px;
    align-items:end;
    padding:14px 16px;
    border-radius:16px;
    background:var(--card);
    border:1px solid var(--border);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    box-shadow:0 14px 40px rgba(0,0,0,.32);
  }
  .field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
  .field label{
    font-size:11px; color:var(--muted);
    letter-spacing:.6px; padding-left:3px;
  }
  .select-wrap{ position:relative; }
  .select-wrap::after{
    content:""; position:absolute; right:15px; top:50%;
    width:8px; height:8px; margin-top:-6px;
    border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
    transform:rotate(45deg); pointer-events:none;
  }
  select,input[type=text]{
    width:100%; height:44px; padding:0 14px;
    font-size:15px; font-family:inherit; color:var(--text);
    background:rgba(255,255,255,.05);
    border:1px solid var(--border); border-radius:12px;
    outline:none; transition:.2s;
  }
  select{ appearance:none; -webkit-appearance:none; padding-right:38px; cursor:pointer; }
  select option{ background:#141b30; color:#e8ecf5; }
  select:focus,input[type=text]:focus{
    border-color:rgba(79,140,255,.75);
    box-shadow:0 0 0 3px rgba(79,140,255,.16);
    background:rgba(255,255,255,.07);
  }
  input[type=text]::placeholder{ color:#5f6b88; }

  .btn-play{
    height:44px; padding:0 24px;
    border:0; border-radius:12px;
    font-family:inherit; font-size:15px; font-weight:600; color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 8px 22px rgba(79,140,255,.35);
    cursor:pointer; white-space:nowrap;
    transition:transform .15s,box-shadow .2s,filter .2s;
  }
  .btn-play:hover{ filter:brightness(1.12); box-shadow:0 10px 30px rgba(79,140,255,.5); }
  .btn-play:active{ transform:translateY(1px) scale(.99); }

  /* ---------- 小屏：两行紧凑排布 ---------- */
  @media (max-width:760px){
    .topbar .wrap{ height:56px; width:calc(100% - 24px); }
    .logo{ font-size:15px; }

    main{
      width:calc(100% - 20px);
      padding:12px 0 calc(14px + env(safe-area-inset-bottom));
      gap:10px;
    }
    .controls{
      grid-template-columns:minmax(0,1fr) auto;
      grid-template-areas:
        "route play"
        "url   url";
      gap:10px;
      padding:12px;
      border-radius:14px;
    }
    .field-route{ grid-area:route; }
    .field-url  { grid-area:url;  }
    .btn-play   { grid-area:play; padding:0 18px; }

    /* 小屏隐藏字段标签，省出高度给播放器 */
    .field label{ display:none; }
    .player-frame{ border-radius:12px; }
    .placeholder .big{ font-size:28px; }
    .placeholder b{ font-size:14px; }
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; left:50%; bottom:26px; z-index:60;
    padding:10px 20px; border-radius:12px; font-size:14px;
    background:rgba(20,27,48,.96); border:1px solid var(--border);
    box-shadow:0 12px 34px rgba(0,0,0,.5);
    opacity:0; transform:translate(-50%,16px);
    pointer-events:none;
    transition:opacity .25s, transform .25s;
    max-width:calc(100vw - 40px);
    text-align:center;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- 说明弹层 ---------- */
  dialog{
    width:min(460px, calc(100vw - 36px));
    padding:22px;
    color:var(--text);
    background:#121a2e;
    border:1px solid var(--border);
    border-radius:18px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  dialog::backdrop{ background:rgba(5,8,18,.66); backdrop-filter:blur(4px); }
  dialog h3{ margin:0 0 12px; font-size:16px; }
  dialog ol{
    margin:0 0 16px; padding-left:20px;
    color:var(--muted); font-size:14px; line-height:2;
  }
  dialog code{
    padding:1px 6px; border-radius:6px; font-size:13px;
    background:rgba(255,255,255,.08); color:#a8c4ff;
  }
  dialog .btn-play{ width:100%; }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="logo"><i></i>多播放器演示</div>
    <div class="top-actions">
      <button type="button" class="ghost-btn" id="helpBtn">使用说明</button>
    </div>
  </div>
</header>

<main>
  <!-- 播放区 -->
  <section class="stage">
    <div class="player-frame">
      <iframe id="player"
              title="播放器"
              allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
              allowfullscreen
              referrerpolicy="no-referrer"></iframe>
      <div class="placeholder" id="placeholder">
        <div class="big">▶</div>
        <b>还没有开始播放</b>
        <span>选择线路 · 输入地址 · 点击播放</span>
      </div>
    </div>
  </section>

  <!-- 控制条 -->
  <section class="controls">
    <div class="field field-route">
      <label for="jk">播放器线路</label>
      <div class="select-wrap">
        <select id="jk"></select>
      </div>
    </div>

    <div class="field field-url">
      <label for="url">播放地址</label>
      <input type="text" id="url" autocomplete="off" spellcheck="false"
             placeholder="粘贴 m3u8 / mp4 地址，回车播放">
    </div>

    <button type="button" class="btn-play" id="playBtn">立即播放</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<dialog id="helpDlg">
  <h3>使用说明</h3>
  <ol>
    <li>在「播放器线路」中选择一个播放器内核。</li>
    <li>在「播放地址」粘贴视频直链（<code>.m3u8</code> / <code>.mp4</code> 等）。</li>
    <li>点击「立即播放」或直接回车，地址会自动编码后拼到线路前缀上。</li>
  </ol>
  <button type="button" class="btn-play" id="closeHelp">知道了</button>
</dialog>

<script>
(function () {
  "use strict";

  /* ===== 1. 线路配置：增删播放器只改这里 ===== */
  var ROUTES = [
    { name: "muiplayer",   url: "https://nojx.cc/bfq/muiplayer?url=" },
    { name: "dplayer",     url: "https://nojx.cc/bfq/dplayer?url=" },
    { name: "ffplayer",    url: "https://nojx.cc/bfq/ffplayer?url=" },
    { name: "aliplayer 1", url: "https://nojx.cc/bfq/ali?url=" },
    { name: "aliplayer 2", url: "https://nojx.cc/bfq/ali/aliplayer.html?url=" },
    { name: "h5",          url: "https://nojx.cc/bfq/h5?url=" },
    { name: "playerjs",    url: "https://nojx.cc/bfq/playerjs?url=" },
    { name: "xgplayer",    url: "https://nojx.cc/bfq/xgplayer?url=" },
    { name: "xgplayer2",   url: "https://nojx.cc/bfq/xgplayer2?url=" },
    { name: "zhilian",     url: "https://nojx.cc/bfq/zhilian?url=" },
    { name: "wujin",       url: "https://jx.wujinkk.com/dplayer/?url=" },
    { name: "ckplayer",    url: "https://www.damojx.com/dm/dm.html?url=" },
    { name: "skplayer",    url: "https://open.wn231.com/?url=" }
  ];

  /* ===== 2. 元素引用 ===== */
  var $ = function (id) { return document.getElementById(id); };
  var select      = $("jk"),
      input       = $("url"),
      frame       = $("player"),
      placeholder = $("placeholder"),
      playBtn     = $("playBtn"),
      toastEl     = $("toast"),
      helpDlg     = $("helpDlg");

  /* ===== 3. 渲染线路下拉框 ===== */
  var frag = document.createDocumentFragment();
  ROUTES.forEach(function (r, i) {
    var opt = document.createElement("option");
    opt.value = r.url;
    opt.textContent = r.name;
    if (i === 0) opt.selected = true;
    frag.appendChild(opt);
  });
  select.appendChild(frag);

  /* ===== 4. Toast ===== */
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2200);
  }

  /* ===== 5. 核心：拼接并播放 ===== */
  var hasPlayed = false;

  function play() {
    var raw = input.value.trim();
    if (!raw) {
      toast("请先输入播放地址");
      input.focus();
      return;
    }
    if (!/^https?:\/\//i.test(raw)) {
      raw = "https://" + raw;
      input.value = raw;
    }

    var base = select.value;
    var name = select.options[select.selectedIndex].text;

    // 对地址做 URL 编码，避免 ? & # 破坏参数
    frame.src = base + encodeURIComponent(raw);

    if (!hasPlayed) {
      hasPlayed = true;
      placeholder.style.display = "none";
    }
    toast("正在使用「" + name + "」加载…");
  }

  /* ===== 6. 事件绑定 ===== */
  playBtn.addEventListener("click", play);

  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      play();
      input.blur();          // 收起移动端键盘，露出播放器
    }
  });

  // 切换线路：已播放过则自动重载
  select.addEventListener("change", function () {
    if (hasPlayed) play();
  });

  /* ===== 7. 说明弹层 ===== */
  $("helpBtn").addEventListener("click", function () {
    if (typeof helpDlg.showModal === "function") helpDlg.showModal();
  });
  $("closeHelp").addEventListener("click", function () {
    helpDlg.close();
  });
  helpDlg.addEventListener("click", function (e) {
    if (e.target === helpDlg) helpDlg.close();
  });
})();
</script>
</body>
</html>
